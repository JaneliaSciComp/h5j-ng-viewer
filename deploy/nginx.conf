server {
    listen 443 ssl;
    # Separate directive rather than `listen ... http2`, which nginx has deprecated
    # since 1.25.1 and warns about on every start.
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/h5j-ng-viewer.crt;
    ssl_certificate_key /etc/nginx/ssl/h5j-ng-viewer.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # The app bundle is ~1.8 MB and compresses to under a third of that. Worth it over
    # anything slower than a LAN. The .wasm core is already compressed internally, so it
    # is deliberately not in this list.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------------
    # Cross-origin isolation. Without BOTH of these the browser does not define
    # SharedArrayBuffer, ffmpeg.wasm cannot start its threads, and the app refuses to
    # load with an explanatory message from src/main.tsx rather than a blank page.
    #
    # `always` includes them on error and 304 responses too -- a 304 for index.html
    # without them would silently drop isolation on a repeat visit.
    #
    # READ THIS BEFORE ADDING A LOCATION BLOCK: nginx's add_header does NOT inherit into
    # a location that sets any add_header of its own. Every location below that adds a
    # Cache-Control therefore has to repeat these two lines. Forgetting is not a syntax
    # error -- it produces an app that works on first load and mysteriously does not
    # after a cache hit.
    # ---------------------------------------------------------------------------
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;

    # Fetched fresh every visit, so a rebuild is picked up without users clearing
    # anything. It is 408 bytes; there is nothing to save by caching it.
    location = /index.html {
        add_header Cache-Control                "no-cache"     always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    }

    # The service worker, and the one file where a stale cache does lasting damage: it
    # is what serves the converted volume to Neuroglancer, so an old copy paired with a
    # new build means chunk requests answered by code that disagrees about the layout.
    # Browsers already bypass the HTTP cache when checking a worker for updates, but
    # only reliably when its max-age is under a day -- so say no-cache and stop
    # depending on that.
    location = /sw.js {
        add_header Cache-Control                "no-cache"     always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    }

    # Hashed filenames, from Vite for the app's own chunks and from Neuroglancer's build
    # for the ones copied in beside them. The name changes when the content does, so
    # these can be cached hard and never revalidated.
    location /assets/ {
        add_header Cache-Control                "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    }

    # The vendored ffmpeg.wasm core -- 23 MB, and NOT hashed, so it cannot be treated as
    # immutable: an ffmpeg upgrade reuses these exact filenames. `no-cache` still lets
    # the browser keep its copy, it just has to revalidate, and the 304 that almost
    # always comes back costs nothing next to re-downloading 23 MB.
    #
    # The explicit type is belt and braces: nginx has mapped .wasm since 1.21.5, but if
    # it ever arrived as application/octet-stream, instantiateStreaming would reject it.
    location /ffmpeg-core/ {
        default_type                            application/wasm;
        add_header Cache-Control                "no-cache"     always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    }

    # Not a real path on disk: the service worker invents it, answering these requests
    # out of the browser's own storage. Nothing should ever reach nginx here. Returning
    # 404 rather than letting the fallback below hand back index.html matters because of
    # how the alternative fails -- Neuroglancer would receive HTML with a 200 status
    # where it expected voxels, and report a parse error that says nothing about the
    # service worker not being registered, which is the actual problem.
    location /zarr/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Redirect anyone who typed http:// to https://. Not a nicety: service workers, OPFS and
# SharedArrayBuffer are all hidden outside a secure context, so the app cannot run at all
# over plain http to anything but localhost.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
